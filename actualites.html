            <p>L'achèvement de la grange marque une étape majeure du projet d'élevage porcin lancé avec le Rotary local : les animaux rejoignent des installations adaptées et durables.</p>

        </article>

            <p>Maïs, vétiver, hibiscus, soja, carottes et oignons : les terres acquises en 2011 entrent en production, au bénéfice direct de la sécurité alimentaire des communautés.</p>
